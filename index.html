    document.getElementById('frame2')
  ];
  const iframes = [
    document.getElementById('iframe0'),
    document.getElementById('iframe1'),
    document.getElementById('iframe2')
  ];
  const overlay = document.getElementById('transition-overlay');

  // Load first site immediately
  iframes[0].src = srcs[0];
  // Pre-load next sites
  iframes[1].src = srcs[1];
  iframes[2].src = srcs[2];

  function switchTo(idx) {
    if (idx < 0 || idx >= srcs.length) return;
    // Fade out
    overlay.classList.add('fade-in');
    setTimeout(() => {
      frames[current].classList.remove('active');
      current = idx;
      frames[current].classList.add('active');
      // Fade in
      overlay.classList.remove('fade-in');
    }, 400);
  }

  window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.action === 'nextSite') {
      if (current < srcs.length - 1) switchTo(current + 1);
    } else if (e.data.action === 'prevSite') {
      if (current > 0) switchTo(current - 1);
    }
  });
</script>
</body>
</html>
